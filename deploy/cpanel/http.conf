# cPanel (Apache) — http://domaine : tout passe en HTTPS, sauf la validation du certificat
# (AutoSSL / Let's Encrypt). À copier dans :
#   /etc/apache2/conf.d/userdata/std/2_4/<utilisateur cPanel>/<domaine>/suivi-agent.conf
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
