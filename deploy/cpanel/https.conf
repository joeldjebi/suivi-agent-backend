# cPanel (Apache) — https://domaine : renvoi vers Suivi Agent (port PUBLIC_PORT, 8090).
# Site, API et temps réel (WebSocket) passent par le même port. À copier dans :
#   /etc/apache2/conf.d/userdata/ssl/2_4/<utilisateur cPanel>/<domaine>/suivi-agent.conf
ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 3600
RequestHeader set X-Forwarded-Proto "https"

# Renouvellement du certificat : servi par cPanel, pas par l'application.
ProxyPass /.well-known/ !

# Temps réel (Socket.IO) : connexion WebSocket permanente.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/?socket\.io/(.*)$ ws://127.0.0.1:8090/socket.io/$1 [P,L]

ProxyPass / http://127.0.0.1:8090/
ProxyPassReverse / http://127.0.0.1:8090/
