# Production de Suivi Agent : base PostGIS, Redis, API et site web (Nginx) sur un seul port.
# Tout est isolé dans ses conteneurs : rien n'est partagé avec les autres projets du serveur.
#
# Arborescence attendue sur le serveur :
#   /opt/suivi-agent/suivi-agent-backend   (ce dépôt)
#   /opt/suivi-agent/suivi-agent-frontend  (dépôt du site web)
#
# Depuis ce dossier (deploy/) : docker compose -f docker-compose.prod.yml up -d --build
name: suivi-agent

# Journaux des conteneurs limités (3 fichiers de 10 Mo par service) : le disque ne se
# remplit pas avec le temps.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      APP_DB_USER: ${DATABASE_APP_USER}
      APP_DB_PASSWORD: ${DATABASE_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/20-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build: ..
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRUST_PROXY: 1
    # Clés hors dépôt (compte de service Firebase pour les notifications push).
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../../suivi-agent-frontend
      args:
        VITE_PLATFORM_PATH: ${VITE_PLATFORM_PATH:-}
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${PUBLIC_PORT:-8090}:80"
    depends_on:
      - api

  # Sauvegarde de la base chaque nuit (2 h), vérifiée, gardée 14 jours, hors du dossier du
  # code : /opt/suivi-agent/backups. Restauration : sh restore.sh <fichier>.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${DATABASE_USER}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: ${DATABASE_NAME}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-../../backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
