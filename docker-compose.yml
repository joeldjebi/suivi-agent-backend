# Services de développement : PostgreSQL + PostGIS et Redis.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: suivi
      POSTGRES_PASSWORD: suivi
      POSTGRES_DB: suivi_agent
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/20-init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
